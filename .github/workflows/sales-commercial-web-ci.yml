name: Sales Commercial Web CI
on:
  pull_request:
    paths: ['src/views/login/sales/**', 'src/api/salesCommercial.js', 'src/router/index.js', 'src/main.js', 'src/views/login/PlatformPortalView.vue', 'e2e/public.spec.js', '.github/workflows/sales-commercial-web-ci.yml']
  push:
    branches: ['dev']
    paths: ['src/views/login/sales/**', 'src/api/salesCommercial.js', 'src/router/index.js', 'src/main.js', 'src/views/login/PlatformPortalView.vue', 'e2e/public.spec.js', '.github/workflows/sales-commercial-web-ci.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build

