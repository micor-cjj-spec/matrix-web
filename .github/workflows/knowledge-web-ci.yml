name: Knowledge Web CI

on:
  pull_request:
    branches:
      - dev
      - 'agent/knowledge-*'
    paths:
      - 'src/App.vue'
      - 'src/components/ai/KnowledgeAclLauncher.vue'
      - 'src/views/ai/**'
      - 'src/api/ai.js'
      - 'src/api/knowledge*.js'
      - 'src/router/index.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/knowledge-web-ci.yml'
  push:
    branches:
      - dev
      - 'agent/knowledge-*'
    paths:
      - 'src/App.vue'
      - 'src/components/ai/KnowledgeAclLauncher.vue'
      - 'src/views/ai/**'
      - 'src/api/ai.js'
      - 'src/api/knowledge*.js'
      - 'src/router/index.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/knowledge-web-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build knowledge workbench
        run: npm run build
