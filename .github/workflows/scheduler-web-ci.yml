name: Scheduler Web CI

on:
  push:
    branches: [dev]
    paths:
      - 'src/api/scheduler.js'
      - 'src/views/scheduler/**'
      - 'src/main.js'
      - 'package.json'
      - '.github/workflows/scheduler-web-ci.yml'
  pull_request:
    paths:
      - 'src/api/scheduler.js'
      - 'src/views/scheduler/**'
      - 'src/main.js'
      - 'package.json'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
