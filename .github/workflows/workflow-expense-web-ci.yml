name: Workflow Expense Web CI

on:
  pull_request:
    branches:
      - dev
    paths:
      - 'src/main.js'
      - 'src/api/workflow.js'
      - 'src/api/expense.js'
      - 'src/api/imManagement.js'
      - 'src/utils/currentUser.js'
      - 'src/views/login/PlatformPortalView.vue'
      - 'src/views/login/workflow/**'
      - 'src/views/login/expense/**'
      - 'src/views/im/ImManagementView.vue'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/workflow-expense-web-ci.yml'
  push:
    branches:
      - 'feature/workflow-expense-*'
    paths:
      - 'src/main.js'
      - 'src/api/workflow.js'
      - 'src/api/expense.js'
      - 'src/api/imManagement.js'
      - 'src/utils/currentUser.js'
      - 'src/views/login/PlatformPortalView.vue'
      - 'src/views/login/workflow/**'
      - 'src/views/login/expense/**'
      - 'src/views/im/ImManagementView.vue'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/workflow-expense-web-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
