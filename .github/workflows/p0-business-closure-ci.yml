name: P0 Business Closure Web CI

on:
  pull_request:
    branches:
      - dev
    paths:
      - 'src/views/login/expense/**'
      - 'src/views/login/workflow/**'
      - 'src/views/login/shared/**'
      - 'src/api/expense.js'
      - 'src/api/workflow.js'
      - 'src/api/workflowAttachment.js'
      - 'src/api/sharedOperations.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/p0-business-closure-ci.yml'
  push:
    branches:
      - 'feature/p0-expense-shared-*'
    paths:
      - 'src/views/login/expense/**'
      - 'src/views/login/workflow/**'
      - 'src/views/login/shared/**'
      - 'src/api/workflowAttachment.js'
      - 'src/api/sharedOperations.js'
      - 'package.json'
      - 'package-lock.json'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
