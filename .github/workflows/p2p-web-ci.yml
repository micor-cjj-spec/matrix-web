name: P2P Web CI

on:
  push:
    branches:
      - dev
    paths:
      - 'src/api/p2p.js'
      - 'src/views/login/p2p/**'
      - 'src/router/index.js'
      - 'src/main.js'
      - 'src/views/login/finance/FinanceSystemView.vue'
      - 'src/views/login/finance/PayableView.vue'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/p2p-web-ci.yml'
  pull_request:
    branches:
      - dev
    paths:
      - 'src/api/p2p.js'
      - 'src/views/login/p2p/**'
      - 'src/router/index.js'
      - 'src/main.js'
      - 'src/views/login/finance/FinanceSystemView.vue'
      - 'src/views/login/finance/PayableView.vue'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/p2p-web-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
