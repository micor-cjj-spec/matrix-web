name: BOTP Web CI

on:
  pull_request:
    paths:
      - 'src/api/botp.js'
      - 'src/views/botp/**'
      - 'src/main.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/botp-ci.yml'
  push:
    branches:
      - feature/botp-foundation
    paths:
      - 'src/api/botp.js'
      - 'src/views/botp/**'
      - 'src/main.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/botp-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
